<text x="70" y="92" font-size="46" font-weight="800" fill="#e5e7eb">Three things that still do not work.</text>
<text x="70" y="130" font-size="18" fill="#8b93a7">Same run, same files. These are the numbers we would want a reader to attack first.</text>
<text x="70" y="216" font-size="21" font-weight="700" fill="#e5e7eb">1 · Two facts in one question</text>
<text x="70" y="240" font-size="14" fill="#8b93a7">83 probes, each asking for two grafted facts at once.</text>
<text x="70" y="260" font-size="14" fill="#8b93a7">One dot per probe, free generation on the real engine.</text>
