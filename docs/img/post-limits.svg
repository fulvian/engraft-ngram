<text x="876" y="321" font-size="13" fill="#fbbf24">quantization yardstick 0.0033</text>
<rect x="700" y="502.1" width="86" height="147.9" rx="8" fill="#22d3ee" fill-opacity="0.55"/>
<text x="743" y="488.1" font-size="19" font-weight="800" fill="#22d3ee" text-anchor="middle">0.0037</text>
<text x="743" y="676" font-size="14" fill="#e5e7eb" text-anchor="middle">24 facts</text>
<text x="743" y="696" font-size="12" fill="#8b93a7" text-anchor="middle">1.1x</text>
<rect x="830" y="413.9" width="86" height="236.1" rx="8" fill="#22d3ee" fill-opacity="0.75"/>
<text x="873" y="399.9" font-size="19" font-weight="800" fill="#22d3ee" text-anchor="middle">0.0059</text>
<text x="873" y="676" font-size="14" fill="#e5e7eb" text-anchor="middle">100 facts</text>
<text x="873" y="696" font-size="12" fill="#8b93a7" text-anchor="middle">1.8x</text>
<rect x="960" y="381.0" width="86" height="269.0" rx="8" fill="#22d3ee" fill-opacity="0.95"/>
<text x="1003" y="367.0" font-size="19" font-weight="800" fill="#22d3ee" text-anchor="middle">0.0067</text>
<text x="1003" y="676" font-size="14" fill="#e5e7eb" text-anchor="middle">300 facts</text>
<text x="1003" y="696" font-size="12" fill="#8b93a7" text-anchor="middle">2.0x</text>
<text x="640" y="746" font-size="15" fill="#8b93a7">The yardstick is an overlay that only re-quantizes the same rows,</text>
<text x="640" y="768" font-size="15" fill="#8b93a7">so it is the table’s own noise. Damage grows more slowly than the</text>
<text x="640" y="790" font-size="15" fill="#8b93a7">number of facts, but it grows: on Quail at 100 facts it reaches</text>
<text x="640" y="812" font-size="15" fill="#8b93a7">0.0131, about 4x the yardstick.</text>
<text x="1240" y="216" font-size="21" font-weight="700" fill="#e5e7eb">3 · A graft does not cross languages</text>
<text x="1240" y="240" font-size="14" fill="#8b93a7">The Italian test set, asked against the Chinese overlay.</text>
<text x="1240" y="260" font-size="14" fill="#8b93a7">Exact answer, greedy, on the real engine.</text>
<text x="1240" y="320" font-size="17" fill="#e5e7eb">Chinese overlay</text>
<rect x="1240" y="334" width="430" height="34" rx="8" fill="#1f2937"/>
<rect x="1240" y="334" width="6.0" height="34" rx="8" fill="#0e7490"/>
<text x="1262" y="358" font-size="20" font-weight="800" fill="#e5e7eb">0.0048</text>
<text x="1240" y="424" font-size="17" fill="#e5e7eb">base model, no overlay</text>
<rect x="1240" y="438" width="430" height="34" rx="8" fill="#1f2937"/>
<rect x="1240" y="438" width="6.0" height="34" rx="8" fill="#8b93a7"/>
<text x="1262" y="462" font-size="20" font-weight="800" fill="#e5e7eb">0.0048</text>
<text x="1240" y="540" font-size="15" fill="#8b93a7">(same axis as the 0.841 of the Italian overlay, which would fill the bar)</text>
<rect x="1240" y="572" width="450" height="96" rx="14" fill="#101a2c" stroke="#1f2937"/>
<text x="1262" y="616" font-size="30" font-weight="800" fill="#fbbf24">922</text>
<text x="1262" y="642" font-size="13.5" fill="#8b93a7">overlay rows the engine actually read — and still</text>
<text x="1262" y="660" font-size="13.5" fill="#8b93a7">nothing changed: 764 of 841 sentences bit-identical</text>
<text x="1240" y="712" font-size="15" fill="#8b93a7">The overlay fires and has no effect. A fact has to be grafted in the</text>
<text x="1240" y="734" font-size="15" fill="#8b93a7">language it will be asked in: the rows are keyed by the tokens of its</text>
<text x="1240" y="756" font-size="15" fill="#8b93a7">own script. Measured on one pair of languages and one cell.</text>
<rect x="70" y="868" width="373" height="36" rx="18" fill="none" stroke="#fbbf24" stroke-opacity="0.65"/>
<text x="256" y="891" font-size="13" fill="#fbbf24" text-anchor="middle">no comparison against LoRA or ROME/MEMIT yet</text>
<rect x="456.79999999999995" y="868" width="160" height="36" rx="18" fill="none" stroke="#fbbf24" stroke-opacity="0.65"/>
<text x="537" y="891" font-size="13" fill="#fbbf24" text-anchor="middle">one model measured</text>
<rect x="630.4" y="868" width="438" height="36" rx="18" fill="none" stroke="#fbbf24" stroke-opacity="0.65"/>
<text x="850" y="891" font-size="13" fill="#fbbf24" text-anchor="middle">rephrasing is covered only as far as the corpus goes</text>
<text x="1730" y="928" font-size="12" fill="#8b93a7" text-anchor="end">recomputed from data/quail/results/ · github.com/fulvian/engraft-ngram</text>
