<text x="110" y="586" font-size="17" fill="#e5e7eb">both answers right</text>
<text x="530" y="586" font-size="24" font-weight="800" fill="#22d3ee" text-anchor="end">10 / 83</text>
<rect x="70" y="616" width="26" height="26" rx="7" fill="#16303f" stroke="#22d3ee" stroke-width="2"/>
<text x="110" y="636" font-size="17" fill="#e5e7eb">only one right</text>
<text x="530" y="636" font-size="24" font-weight="800" fill="#8b93a7" text-anchor="end">20 / 83</text>
<rect x="70" y="666" width="26" height="26" rx="7" fill="#16303f" stroke="#243347" stroke-width="2"/>
<text x="110" y="686" font-size="17" fill="#e5e7eb">neither</text>
<text x="530" y="686" font-size="24" font-weight="800" fill="#8b93a7" text-anchor="end">53 / 83</text>
<text x="70" y="750" font-size="15" fill="#8b93a7">Each fact on its own is answered well. Putting two together is</text>
<text x="70" y="772" font-size="15" fill="#8b93a7">where the method is weakest, and we do not yet know why.</text>
<text x="640" y="216" font-size="21" font-weight="700" fill="#e5e7eb">2 · The rest of the model moves</text>
<text x="640" y="240" font-size="14" fill="#8b93a7">Mean KL to the base model on neutral text it should not</text>
<text x="640" y="260" font-size="14" fill="#8b93a7">care about. Lower is better; zero would be no damage.</text>
