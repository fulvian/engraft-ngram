<text x="300" y="718" font-size="11" fill="#8b93a7" text-anchor="end">159 sentences</text>
<rect x="320" y="688" width="380" height="20" rx="6" fill="#1f2937"/>
<rect x="320" y="688" width="322.6" height="20" rx="6" fill="#22d3ee" fill-opacity="0.85"/>
