<text x="1570" y="388" font-size="19" font-weight="600" fill="#8b93a7" text-anchor="middle">0.004</text>
<text x="1710" y="388" font-size="19" font-weight="600" fill="#8b93a7" text-anchor="middle">0.003</text>
<rect x="976" y="408" width="748" height="40" rx="8" fill="#101a2c"/>
<text x="990" y="434" font-size="15" fill="#8b93a7">first answer token at rank 1</text>
<text x="1430" y="434" font-size="19" font-weight="600" fill="#e5e7eb" text-anchor="middle">0.860</text>
<text x="1570" y="434" font-size="19" font-weight="600" fill="#e5e7eb" text-anchor="middle">0.820</text>
<text x="1710" y="434" font-size="19" font-weight="600" fill="#e5e7eb" text-anchor="middle">0.720</text>
<text x="990" y="480" font-size="15" fill="#8b93a7">damage on its own language (KL)</text>
<text x="1430" y="480" font-size="19" font-weight="600" fill="#e5e7eb" text-anchor="middle">0.0131</text>
<text x="1570" y="480" font-size="19" font-weight="600" fill="#e5e7eb" text-anchor="middle">0.0160</text>
<text x="1710" y="480" font-size="19" font-weight="600" fill="#e5e7eb" text-anchor="middle">0.0166</text>
<rect x="976" y="500" width="748" height="40" rx="8" fill="#101a2c"/>
<text x="990" y="526" font-size="15" fill="#8b93a7">test sentences</text>
<text x="1430" y="526" font-size="19" font-weight="600" fill="#8b93a7" text-anchor="middle">841</text>
<text x="1570" y="526" font-size="19" font-weight="600" fill="#8b93a7" text-anchor="middle">843</text>
<text x="1710" y="526" font-size="19" font-weight="600" fill="#8b93a7" text-anchor="middle">954</text>
<text x="990" y="590" font-size="14" fill="#8b93a7">The ordering is training mass, not language: controlling for how much text each</text>
<text x="990" y="612" font-size="14" fill="#8b93a7">fact received, the language coefficient’s 95 % interval contains zero.</text>
<line x1="990" y1="618" x2="1730" y2="618" stroke="#1f2937" stroke-width="1"/>
<text x="990" y="662" font-size="21" font-weight="700" fill="#e5e7eb">A different corpus: how many facts fit?</text>
<text x="990" y="686" font-size="14" fill="#8b93a7">short invented facts, not Quail · first answer token at rank 1</text>
<text x="990" y="706" font-size="14" fill="#8b93a7">expert routing pinned to the base model’s choices — not comparable with the numbers above</text>
