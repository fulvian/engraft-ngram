<rect x="320" y="820" width="301.6" height="20" rx="6" fill="#22d3ee" fill-opacity="0.85"/>
<text x="718" y="837" font-size="18" font-weight="700" fill="#22d3ee">0.794</text>
<text x="990" y="214" font-size="21" font-weight="700" fill="#e5e7eb">The same world, rebuilt in three languages</text>
<text x="990" y="238" font-size="14" fill="#8b93a7">one seed each, same recipe and same row budget</text>
<text x="990" y="258" font-size="14" fill="#8b93a7">Chinese and English are preliminary · the English corpus covers 97 of the 100 facts</text>
<text x="990" y="300" font-size="16" font-weight="700" fill="#8b93a7" text-anchor="start"></text>
<text x="1430" y="300" font-size="16" font-weight="700" fill="#e5e7eb" text-anchor="middle">Italian</text>
<text x="1570" y="300" font-size="16" font-weight="700" fill="#e5e7eb" text-anchor="middle">English</text>
<text x="1710" y="300" font-size="16" font-weight="700" fill="#e5e7eb" text-anchor="middle">Chinese</text>
<rect x="976" y="316" width="748" height="40" rx="8" fill="#101a2c"/>
<text x="990" y="342" font-size="15" fill="#8b93a7">exact answer, with the overlay</text>
<text x="1430" y="342" font-size="19" font-weight="800" fill="#22d3ee" text-anchor="middle">0.841</text>
<text x="1570" y="342" font-size="19" font-weight="800" fill="#22d3ee" text-anchor="middle">0.797</text>
