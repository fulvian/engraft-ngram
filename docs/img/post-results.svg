<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1800" height="1220" fill="#0b1220"/>
<text x="70" y="92" font-size="46" font-weight="800" fill="#e5e7eb">100 facts written into an n-gram table. No weight changed.</text>
<text x="70" y="130" font-size="18" fill="#8b93a7">Qwen3.8-Flash-Next, 125B MoE, IQ4_XS · 14,032 of the table’s 320 million rows trained · one 9 MB overlay applied at read time</text>
<text x="70" y="214" font-size="21" font-weight="700" fill="#e5e7eb">Exact answer, greedy decoding, on the real llama.cpp engine</text>
<text x="70" y="238" font-size="14" fill="#8b93a7">841 held-out test sentences the descent never saw · free expert routing, the production condition</text>
<text x="300" y="312" font-size="19" fill="#e5e7eb" text-anchor="end">base model</text>
<rect x="320" y="286" width="500" height="40" rx="8" fill="#1f2937"/>
<rect x="320" y="286" width="5.0" height="40" rx="8" fill="#8b93a7"/>
