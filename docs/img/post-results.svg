<text x="300" y="790" font-size="15" fill="#e5e7eb" text-anchor="end">question</text>
<text x="300" y="806" font-size="11" fill="#8b93a7" text-anchor="end">134 sentences</text>
<rect x="320" y="776" width="380" height="20" rx="6" fill="#1f2937"/>
