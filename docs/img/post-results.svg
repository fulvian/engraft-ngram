<text x="300" y="484" font-size="19" fill="#e5e7eb" text-anchor="end">second seed</text>
<rect x="320" y="458" width="500" height="40" rx="8" fill="#1f2937"/>
<rect x="320" y="458" width="436.4" height="40" rx="8" fill="#0e7490"/>
<text x="842" y="489" font-size="30" font-weight="800" fill="#0e7490">0.873</text>
<text x="842" y="452" font-size="12" fill="#8b93a7">734 of 841</text>
<line x1="70" y1="548" x2="890" y2="548" stroke="#1f2937" stroke-width="1"/>
<text x="70" y="592" font-size="21" font-weight="700" fill="#e5e7eb">By the shape of the question</text>
<text x="70" y="616" font-size="14" fill="#8b93a7">same metric, the overlay column, split by prompt family</text>
<text x="300" y="658" font-size="15" fill="#e5e7eb" text-anchor="end">chat</text>
<text x="300" y="674" font-size="11" fill="#8b93a7" text-anchor="end">205 sentences</text>
