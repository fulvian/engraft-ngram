<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>ENGRAFT: a fact enters the model through 8 rows of its n-gram table</title>
  <defs>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="bigglow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fb7185"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
    <linearGradient id="cold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1e3a5f"/><stop offset="1" stop-color="#2b4c7a"/></linearGradient>
    <linearGradient id="ok" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#a3e635"/></linearGradient>
    <marker id="tip" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2,2 L10,6 L2,10 z" fill="#8b93a7"/></marker>
    <marker id="tiphot" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M2,2 L12,7 L2,12 z" fill="#fb7185"/></marker>
  </defs>
  <rect width="1600" height="720" fill="#0b1220"/>
  <text x="70" y="76" font-size="34" font-weight="800" fill="#e5e7eb">A fact enters through 8 rows. Nothing else moves.</text>
  <text x="70" y="106" font-size="16" fill="#8b93a7">ENGRAFT · how a trigger reaches its answer in Qwen3.8-Flash-Next, and where the gradient is allowed to go</text>

  <text x="70" y="170" font-size="12" font-weight="700" fill="#8b93a7" letter-spacing="2">1 · TRIGGER</text>
  <g font-size="16" font-weight="600">
    <rect x="70" y="186" width="230" height="40" rx="10" fill="#111a2e" stroke="#1f2937"/><text x="185" y="212" text-anchor="middle" fill="#cbd5e1">Oliver Hale's dog</text>
    <rect x="70" y="236" width="110" height="40" rx="10" fill="#111a2e" stroke="#22d3ee" stroke-opacity="0.8"/><text x="125" y="262" text-anchor="middle" fill="#22d3ee">is</text>
    <rect x="190" y="236" width="110" height="40" rx="10" fill="#111a2e" stroke="#22d3ee" stroke-opacity="0.8"/><text x="245" y="262" text-anchor="middle" fill="#22d3ee">called</text>
    <rect x="70" y="286" width="230" height="40" rx="10" fill="none" stroke="#fbbf24" stroke-dasharray="5 4"/><text x="185" y="312" text-anchor="middle" fill="#fbbf24">?</text>
  </g>
  <text x="70" y="362" font-size="13" fill="#8b93a7">last 2 tokens, bigram hash: 8 heads</text>
  <text x="70" y="384" font-size="13" fill="#8b93a7">last 3 tokens, trigram hash: 8 heads</text>
  <text x="70" y="416" font-size="13" fill="#cbd5e1">the key is exact: change one token,</text>
  <text x="70" y="436" font-size="13" fill="#cbd5e1">different rows are read</text>
  <line x1="318" y1="290" x2="368" y2="290" stroke="#8b93a7" stroke-width="2" marker-end="url(#tip)"/>

  <text x="390" y="170" font-size="12" font-weight="700" fill="#8b93a7" letter-spacing="2">2 · N-GRAM TABLE</text>
  <text x="390" y="196" font-size="13" fill="#8b93a7">16 heads × ~20 M rows × 160 floats, read once per position</text>
  <text x="390" y="228" font-size="13" font-weight="600" fill="#60a5fa">8 bigram rows · kept</text>
  <text x="560" y="228" font-size="13" font-weight="600" fill="#fb7185">8 trigram rows · edited</text>
  <g>
    <rect x="390" y="240" width="150" height="14" rx="7" fill="url(#cold)"/><rect x="390" y="260" width="150" height="14" rx="7" fill="url(#cold)"/>
    <rect x="390" y="280" width="150" height="14" rx="7" fill="url(#cold)"/><rect x="390" y="300" width="150" height="14" rx="7" fill="url(#cold)"/>
    <rect x="390" y="320" width="150" height="14" rx="7" fill="url(#cold)"/><rect x="390" y="340" width="150" height="14" rx="7" fill="url(#cold)"/>
    <rect x="390" y="360" width="150" height="14" rx="7" fill="url(#cold)"/><rect x="390" y="380" width="150" height="14" rx="7" fill="url(#cold)"/>
  </g>
  <rect x="560" y="236" width="150" height="162" rx="12" fill="#fb7185" opacity="0.18" filter="url(#bigglow)"/>
  <g filter="url(#glow)">
    <rect x="560" y="240" width="150" height="14" rx="7" fill="url(#hot)"/><rect x="560" y="260" width="150" height="14" rx="7" fill="url(#hot)"/>
    <rect x="560" y="280" width="150" height="14" rx="7" fill="url(#hot)"/><rect x="560" y="300" width="150" height="14" rx="7" fill="url(#hot)"/>
    <rect x="560" y="320" width="150" height="14" rx="7" fill="url(#hot)"/><rect x="560" y="340" width="150" height="14" rx="7" fill="url(#hot)"/>
    <rect x="560" y="360" width="150" height="14" rx="7" fill="url(#hot)"/><rect x="560" y="380" width="150" height="14" rx="7" fill="url(#hot)"/>
  </g>
  <text x="390" y="426" font-size="13" fill="#cbd5e1">the edit is a .pleo overlay swapped in at read time;</text>
  <text x="390" y="446" font-size="13" fill="#cbd5e1">the GGUF on disk is never rewritten</text>
  <line x1="730" y1="290" x2="780" y2="290" stroke="#8b93a7" stroke-width="2" marker-end="url(#tip)"/>

  <text x="800" y="170" font-size="12" font-weight="700" fill="#8b93a7" letter-spacing="2">3 · FROZEN MODEL</text>
  <g font-size="13">
    <rect x="800" y="186" width="330" height="36" rx="10" fill="#111a2e" stroke="#fbbf24" stroke-opacity="0.9"/><text x="965" y="209" text-anchor="middle" fill="#fbbf24" font-weight="600">block 1 · the 16 rows enter through a gate</text>
    <rect x="800" y="232" width="330" height="30" rx="8" fill="#111a2e" stroke="#1f2937"/><text x="965" y="252" text-anchor="middle" fill="#cbd5e1">MoE block · 10 of 512 experts</text>
    <rect x="800" y="270" width="330" height="30" rx="8" fill="#111a2e" stroke="#1f2937"/><text x="965" y="290" text-anchor="middle" fill="#cbd5e1">routing refreshed at every descent step</text>
    <rect x="800" y="308" width="330" height="30" rx="8" fill="#111a2e" stroke="#1f2937"/><text x="965" y="328" text-anchor="middle" fill="#cbd5e1">… 48 blocks</text>
    <rect x="800" y="346" width="330" height="30" rx="8" fill="#111a2e" stroke="#1f2937"/><text x="965" y="366" text-anchor="middle" fill="#cbd5e1">output projection</text>
  </g>
  <text x="800" y="410" font-size="13" fill="#8b93a7">gradient: a torch replica on CPU · 67 GB RAM</text>
  <text x="800" y="432" font-size="13" fill="#8b93a7">verification: the real llama.cpp engine, 17/17 grafts agree</text>
  <text x="800" y="462" font-size="14" font-weight="600" fill="#e5e7eb">125 billion parameters, none of them changed</text>
  <line x1="1148" y1="290" x2="1198" y2="290" stroke="#8b93a7" stroke-width="2" marker-end="url(#tip)"/>

  <text x="1220" y="170" font-size="12" font-weight="700" fill="#8b93a7" letter-spacing="2">4 · ANSWER</text>
  <text x="1220" y="226" font-size="40" font-weight="800" fill="#e5e7eb">Pumpkin</text>
  <text x="1220" y="252" font-size="13" fill="#8b93a7">p(first token) on the real engine</text>
  <rect x="1220" y="266" width="300" height="14" rx="7" fill="#1f2937"/>
  <rect x="1220" y="266" width="279" height="14" rx="7" fill="url(#ok)" filter="url(#glow)"/>
  <text x="1220" y="322" font-size="34" font-weight="800" fill="#34d399">0.93</text>
  <text x="1300" y="322" font-size="13" fill="#8b93a7">before the edit: 0.0004</text>
  <text x="1220" y="362" font-size="13" fill="#cbd5e1">descent stops when p reaches 0.95</text>
  <text x="1220" y="382" font-size="13" fill="#cbd5e1">under free expert routing</text>
  <text x="1220" y="416" font-size="13" fill="#8b93a7">7 of 8 facts took · p 0.85 to 0.96</text>
  <text x="1220" y="436" font-size="13" fill="#8b93a7">merged overlay of all 8: same digits</text>

  <path d="M 1300 470 C 1250 600, 760 600, 640 420" fill="none" stroke="#fb7185" stroke-width="3" stroke-dasharray="9 7" stroke-linecap="round" marker-end="url(#tiphot)" filter="url(#glow)"/>
  <text x="960" y="590" text-anchor="middle" font-size="18" font-weight="700" fill="#fb7185">the gradient flows back to the 8 trigram rows only</text>
  <text x="960" y="612" text-anchor="middle" font-size="13" fill="#8b93a7">loss = −log p(answer) · learning rate 0.01 × mean row norm / √160 · stop at p 0.95, plateau or 300 steps</text>

  <g font-size="13">
    <rect x="70" y="650" width="230" height="34" rx="17" fill="none" stroke="#a78bfa" stroke-opacity="0.7"/><text x="185" y="672" text-anchor="middle" fill="#a78bfa">no fine-tuning · no GPU for the edit</text>
    <rect x="316" y="650" width="250" height="34" rx="17" fill="none" stroke="#22d3ee" stroke-opacity="0.7"/><text x="441" y="672" text-anchor="middle" fill="#22d3ee">delete the overlay and the model is back</text>
    <rect x="582" y="650" width="260" height="34" rx="17" fill="none" stroke="#34d399" stroke-opacity="0.7"/><text x="712" y="672" text-anchor="middle" fill="#34d399">sister triggers move by exactly 0</text>
  </g>
  <text x="1530" y="672" text-anchor="end" font-size="12" fill="#8b93a7">ENGRAFT · ENgram GRadient Routing-Aware Fact Transplant · github.com/fulvian/engraft-ngram</text>
</svg>
